  label: Europe & Mediterranean
  order: 6
  color: "--lane-europe"
  sub_regions:
    - {id: greece, label: Greece}
    - {id: rome, label: Rome & Italy}
    - {id: western-europe, label: Western Europe}
    - {id: eastern-europe, label: Eastern Europe}
