    - {id: north-america, label: North America}

- id: oceania
  label: Oceania
  order: 9
  color: "--lane-oceania"

- id: science
  label: Science & Discovery
  order: 10
  color: "--lane-science"
  note: >-
    People and discoveries. A row of its own so the thread of what was known
    runs alongside what was happening politically. Tag the home region second
    (regions: [science, britain]) - the first entry decides the lane, the rest
    show as chips.

- id: philosophy
  label: Philosophy & Ideas
  order: 11
  color: "--lane-philosophy"
  note: >-
    Philosophers and schools of thought, same convention as science - put the
    home region second.

- id: art-culture
  label: Art & Culture
  order: 12
  color: "--lane-art-culture"
  note: >-
    Makers and the traditions they worked in - poets, painters, sculptors,
    composers. Same convention as science and philosophy: put the home region
    second, so Kalidasa shows an india chip.

    Two things deliberately stay out. Monuments belong to the civilisation that
    raised them, so Angkor Wat, the Taj Mahal, Borobudur and the Great Pyramid
    stay in their regional lanes. And figures who are saints first and poets
    second, like Kabir and Mirabai, stay in their own region: their verse is
    inseparable from the devotional movement beside it.

- id: global
  label: Global
  order: 13
  color: "--lane-global"
  note: Entries with no single home - ages, pandemics, worldwide events.
