# Lanes shown on the timeline, in display order.
# `sub_regions` are used when the view is narrow enough to expand a lane.
- id: earth-life
  label: Earth & Life
  order: 1
  color: "--lane-earth-life"
  # A plain scalar cannot hold "arrived: Lucy" - YAML reads the colon as a
  # mapping - so this is a block scalar.
  note: >-
    Deep time - geology, climate, and the history of life, our own species
    included. This said non-human until Homo sapiens joined the rest of the
    genus here; Lucy, Paranthropus, erectus and the Neanderthals were already
    in this lane, so it had not been true for some time.

- id: india
  label: Indian Subcontinent
  order: 2
  color: "--lane-india"
  sub_regions:
    - {id: north-india, label: North India}
    - {id: south-india, label: South India}
    - {id: east-india, label: East India}
    - {id: west-india, label: West India}
    - {id: deccan, label: Deccan}
    - {id: himalaya, label: Himalaya & Tibet}
    - {id: sri-lanka, label: Sri Lanka}

- id: east-asia
  label: East & Southeast Asia
  order: 3
  color: "--lane-east-asia"
  sub_regions:
    - {id: china, label: China}
    - {id: japan, label: Japan}
    - {id: korea, label: Korea}
    - {id: southeast-asia, label: Southeast Asia}

- id: central-asia
  label: Central Asia & the Steppe
  order: 4
  color: "--lane-central-asia"

- id: west-asia
  label: West Asia & Persia
