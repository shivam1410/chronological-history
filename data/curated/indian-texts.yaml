# The early Indian texts the dataset was missing.
#
# The audit that corrected seven Indian datings also turned up what was simply
# absent: Panini, whose Ashtadhyayi is arguably the first formal system anyone
# built; the Arthashastra as a text rather than as a line in Kautilya's note;
# the Gita, which the Mahabharata entry already referred to without it existing;
# the two medical compendia as a pair; the Sanskrit treatise that Indian
# aesthetics still argues from; the most contested legal text on the
# subcontinent; and the whole early Tamil corpus.
#
# Every date here is contested and most of them are contested widely. The
# brackets are wide on purpose and the notes say where the weight sits, which
# is the only honest way to put a text with no manuscript within nine centuries
# of its composition onto a timeline at all.

- id: panini
  significance: >-
    Roughly four thousand rules, ordered so that a later rule overrides an
    earlier one, written in a technical metalanguage he had to invent before he
    could state them. It is a generative grammar in the modern sense, some
    twenty-three centuries before anyone built another.
  title: Panini
  kind: person
  regions: [science, north-india]
  start: [-500, -380]
  end: [-450, -350]
  importance: 5
  confidence: contested
  categories: [scientist, logic, literature]
  note: >-
    Estimates run from the sixth to the fourth century BCE and turn partly on a
    single word - yavanani in rule 4.1.49, which means either Greek script or
    Greek women. Script implies contact after Alexander and a late date;
    Cardona argues for women and an early one. Most settle near the fourth
    century BCE. He worked at Shalatula in Gandhara, and the Ashtadhyayi was
    built to be memorised rather than read.
  summary: >-
    Grammarian of Sanskrit, whose Ashtadhyayi describes a language as a system
    of rules applied in order rather than as a catalogue of forms — the method
    that twentieth-century linguistics and computer science arrived at
    independently, and then recognised.
  aliases: [Pāṇini]
  related: [upanishads, kautilya]

- id: bhagavad-gita
  significance: >-
    Seven hundred verses inside an epic of a hundred thousand, and the part
    read most outside India. Gandhi called it his dictionary of daily
    reference; Oppenheimer reached for it at Trinity.
  title: The Bhagavad Gita
  kind: work
  regions: [philosophy, north-india]
  start: [-400, -100]
  end: [-100, 200]
  importance: 5
  confidence: contested
  categories: [scripture, philosophy]
  note: >-
    Its date rests on a prior question - whether it belonged to the Mahabharata
    early or was inserted into it later. Estimates run from the fifth century
    BCE to the second century CE and cluster on the second or first century
    BCE. It is less a separate book than a passage that became one.
  summary: >-
    A dialogue between Arjuna and Krishna on the eve of a battle, set inside
    the Mahabharata, arguing that action performed without attachment to its
    result is what resolves the conflict between duty and conscience.
  aliases: [Gita, Bhagavadgita]
  related: [mahabharata, adi-shankara, gandhi-ahimsa, yoga-sutras]

- id: arthashastra
  significance: >-
    It sets out famine relief, tax rates, the licensing of brothels and the
    running of spies in one register, and never once asks whether any of it is
    right. That neutrality is why it read as cynical when it resurfaced.
  title: The Arthashastra
  kind: work
  regions: [philosophy, north-india]
  start: [-200, 100]
  end: [100, 300]
  importance: 4
  confidence: contested
  categories: [philosophy, economics, ethics]
  note: >-
    Lost for centuries, and recovered in 1905 when a manuscript reached the
    Mysore Oriental Library. Tradition ascribes it to Kautilya in the fourth
    century BCE; McClish and Olivelle read the surviving text as a composite
    assembled between the second century BCE and the third century CE over an
    older core. This bracket is the text, not the man.
  summary: >-
    A Sanskrit manual of statecraft covering administration, law, taxation,
    war and espionage, written as instruction to a ruler rather than as an
    argument about what rulers ought to be.
  related: [kautilya, maurya-empire, manusmriti]

- id: manusmriti
  significance: >-
    Ambedkar burned it in public in December 1927, which tells you it was still
    doing work seventeen centuries on. Colonial courts had treated it as the
    Hindu law code, giving one text an authority it never held alone.
  title: The Manusmriti
  kind: work
  regions: [philosophy, north-india]
  start: [-200, 100]
  end: [100, 300]
  importance: 4
  confidence: contested
  categories: [ethics, philosophy]
  note: >-
    Most scholars place it between 200 BCE and 200 CE; Olivelle argues from its
    mention of gold coins as fines that the surviving text is second or third
    century CE. It is composite, and it is one of many dharmashastras - its
    standing as the Hindu law code is largely an artefact of which text the
    British had translated first, by William Jones in 1794.
  summary: >-
    A Sanskrit treatise on dharma setting out duty by varna and by stage of
    life, together with law, penance and statecraft — the most quoted and the
    most contested of the Indian legal texts.
  aliases: [Manava Dharmashastra, Laws of Manu]
  related: [arthashastra, ambedkar]

- id: charaka-samhita
  significance: >-
    It defines what is to count as evidence - testimony, observation,
    inference - before it says anything about disease. The epistemology comes
    first, which is not how most ancient medicine opens.
  title: The Charaka Samhita
  kind: work
  regions: [science, north-india]
  start: [-400, -100]
  end: [400, 600]
  importance: 4
  confidence: contested
  categories: [medicine, scientist]
  note: >-
    Three layers rather than one text. An older compendium ascribed to
    Agnivesha was revised by Charaka somewhere between 100 BCE and 200 CE, and
    about a third of the surviving work was rewritten around the sixth century
    CE by Dridhabala - who says so himself, because that part had been lost.
    The bracket spans all three.
  summary: >-
    The foundational text of Ayurvedic internal medicine, on diagnosis, diet,
    pharmacology and the conduct of physicians, and the counterpart to the
    Sushruta Samhita's surgery.
  related: [sushruta]

- id: natyashastra
  significance: >-
    It treats performance as a mechanism that can be described, and names the
    part that matters most: rasa, the flavour a work leaves in an audience
    rather than the feeling an actor has. Indian aesthetics has been arguing
    with that term ever since.
  title: The Natyashastra
  kind: work
  regions: [art-culture, north-india]
  start: [-400, -100]
  end: [200, 500]
  importance: 4
  confidence: contested
  categories: [drama, music, art, literature]
  note: >-
    Estimates run from 500 BCE to 500 CE. Most hold that the first complete
    version was finished between 200 BCE and 200 CE, over material that had
    been accumulating for some time before that. It is ascribed to Bharata,
    who may be a name for the compilers rather than a person.
  summary: >-
    A Sanskrit treatise on performance covering dance, music, stagecraft,
    costume, gesture and dramatic structure, and setting out the theory of rasa
    that Indian criticism has worked from since.
  aliases: [Natya Shastra]
  related: [kalidasa, bhavabhuti]

- id: sangam-literature
  significance: >-
    Secular poetry of love and war, in a classical language, by hundreds of
    named poets including women, and almost none of it religious. Nothing else
    quite like it survives from early India.
  title: Sangam literature
  kind: work
  regions: [art-culture, south-india]
  start: [-300, -100]
  end: [250, 300]
  importance: 4
  confidence: contested
  categories: [poet, literature]
  note: >-
    Zvelebil puts the bulk of it at 100 BCE to 250 CE on linguistic and
    prosodic grounds; the wider convention is 300 BCE to 300 CE. Excavations at
    Keeladi have been read as pushing Tamil literacy back towards 600 BCE, but
    that reading is disputed and does not date these texts. The legend of three
    academies at Madurai is later than the poems.
  summary: >-
    Some 2,300 Tamil poems in eighteen anthologies by more than 400 poets, on
    love and on war — the oldest surviving literature in any Indian language
    other than Sanskrit.
  related: [thiruvalluvar, tirukkural]

# ---- the rest of the set ----

- id: tirukkural
  significance: >-
    It names no god, no caste and no king, which is why Jains, Shaivas,
    Vaishnavas and nineteenth-century missionaries could each read it as
    theirs. A text survives that long by being usable, not by being agreed
    with.
  title: The Tirukkural
  kind: work
  regions: [art-culture, south-india]
  start: [-300, 500]
  end: [-250, 650]
  importance: 4
  confidence: contested
  categories: [literature, ethics, poet]
  note: >-
    The bracket is as wide as the proposals, which run from 300 BCE to the
    seventh century CE. Zvelebil's 450-500 CE, argued from grammatical
    innovations the Sangam poems do not have, is the usual scholarly position
    now; Vaiyapuri Pillai read the Sanskrit borrowings as pushing it to about
    650. The Tamil Nadu government's 31 BCE is a convention from the 1920s.
  summary: >-
    1,330 Tamil couplets in three books — on virtue, on wealth and government,
    and on love — compressed to seven words a couplet, and the most translated
    Tamil work there is.
  aliases: [Kural, Thirukkural]
  related: [thiruvalluvar, sangam-literature]

- id: yoga-sutras
  significance: >-
    The eight limbs set out here are the skeleton of what the twentieth
    century exported as yoga - though the posture practice that word now means
    occupies about three of its 196 verses.
  title: The Yoga Sutras of Patanjali
  kind: work
  regions: [philosophy, north-india]
  start: [-200, 350]
  end: [-100, 450]
  importance: 4
  confidence: contested
  categories: [philosophy, religion]
  note: >-
    Two positions, both live. Most place the text shortly after the turn of
    the common era; Woods in 1914 and Maas more recently argue for about 400
    CE, reading its arguments against the Buddhist philosopher Vasubandhu.
    Maas also holds that the sutras and the commentary attributed to Vyasa are
    one work by one author, not a text and a later gloss.
  summary: >-
    196 terse aphorisms systematising yoga as the stilling of the movements of
    the mind, and setting out the eight limbs — restraint, observance, posture,
    breath, withdrawal, concentration, meditation, absorption.
  aliases: [Patanjali, Yogasutra, Patanjalayogashastra]
  related: [upanishads, bhagavad-gita, adi-shankara]

- id: puranas
  significance: >-
    Where most of what is now practised as Hinduism is actually written down -
    the gods with biographies, the pilgrimage sites, the festivals, the vows.
    The Vedas are older and the Puranas are what people did.
  title: The Puranas
  kind: work
  regions: [north-india, india]
  start: [200, 400]
  end: [800, 1200]
  importance: 4
  confidence: contested
  categories: [scripture, literature]
  note: >-
    Eighteen Mahapuranas, and no single date among them. Doniger puts the
    Markandeya near 250 CE and the Linga at 600-1000; Rocher's position is
    that each is stratified, grown by accretion over successive eras, so that
    dating any of them as a work is the wrong question. The bracket is the
    span of first versions to settled form, and it is soft at both ends.
  summary: >-
    A body of Sanskrit texts telling cosmology, genealogy and the deeds of the
    gods, and carrying — in a form meant to be recited rather than studied —
    most of the devotional material that Vedic literature does not.
  related: [mahabharata, ramayana, adi-shankara]

- id: panchatantra
  significance: >-
    Translated into Pahlavi, then Arabic, then Hebrew, Latin, Spanish and on,
    and the route by which Indian fables reached Aesop's territory. It may be
    the most widely travelled book written before printing.
  title: The Panchatantra
  kind: work
  regions: [art-culture, north-india]
  start: [100, 400]
  end: [200, 550]
  importance: 4
  confidence: contested
  categories: [literature]
  note: >-
    About 300 CE is the usual guess, and it is a guess - the original is lost
    and Edgerton reconstructed it in 1924 by comparing the surviving
    descendants. The hard end of the bracket is Burzoe's Pahlavi translation
    of about 550 CE, made for the Sasanian court, which proves the book
    existed by then. That version is itself lost; it survives as an Arabic
    translation, Kalila wa Dimna.
  summary: >-
    A Sanskrit collection of interlocking animal fables framed as a course in
    statecraft for three inattentive princes, ascribed to Vishnu Sharma.
  aliases: [Kalila wa Dimna]
  related: [natyashastra, kalidasa]

- id: aryabhatiya
  significance: >-
    The one early Indian text that dates itself. It says the author was
    twenty-three when 3,600 years of the Kali Yuga had passed, which is 499
    CE - a fixed point in a chronology otherwise argued in centuries.
  title: The Aryabhatiya
  kind: work
  regions: [science, north-india]
  start: 499
  end: 499
  importance: 4
  confidence: high
  categories: [mathematics, astronomy]
  note: >-
    In 121 verses it gives a place-value system without a symbol for zero, a
    sine table, a value of pi accurate to four decimal places and described as
    approximate, and a rotating earth to explain the apparent motion of the
    stars. Later Indian astronomers including Brahmagupta rejected the
    rotation.
  summary: >-
    Aryabhata's astronomical and mathematical treatise, compressed into verse
    for memorisation, and the text through which Indian trigonometry and
    place-value arithmetic reached the Islamic world and then Europe.
  related: [aryabhata, brahmagupta, zero-decimal-system, al-khwarizmi]
