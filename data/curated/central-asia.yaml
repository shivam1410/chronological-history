  related: [timurid-empire]

- id: russian-conquest-central-asia
  title: Russian conquest of Central Asia
  kind: period
  regions: [central-asia, eastern-europe]
  start: 1839
  end: 1895
  importance: 4
  confidence: high
  categories: [colonialism, war]
  summary: Tsarist armies absorbed the khanates of Khiva, Bukhara and Kokand,
    closing the era of independent steppe states and bringing Russia to the
    borders of British India.

- id: great-game
  title: The Great Game
  kind: period
  regions: [central-asia, britain]
  start: [1830, 1830]
  end: [1895, 1907]
  importance: 3
  confidence: medium
  categories: [colonialism, war]
  summary: Decades of manoeuvring between the Russian and British empires over
