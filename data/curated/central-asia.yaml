# Central Asia and the Steppe. For most of history this was not a periphery
# between China, Persia and Europe but the corridor connecting them, and the
# source of the cavalry empires that repeatedly overran all three.

- id: horse-domestication
  title: Domestication of the horse
  kind: technology
  regions: [central-asia]
  start: ["5.5 ka", "5 ka"]
  end: ongoing
  importance: 5
  confidence: contested
  categories: [civilisation, discovery]
  note: The Botai culture of northern Kazakhstan shows the earliest strong
    evidence, around 3500 BCE, but genetic work suggests modern domestic horses
    descend from a later lineage on the Pontic-Caspian steppe.
  summary: Riding turned the steppe from a barrier into a highway and gave its
    peoples a military advantage over settled neighbours that lasted until
    gunpowder.

- id: andronovo-culture
  title: Andronovo culture
  kind: period
  regions: [central-asia]
  start: -2000
  end: -900
  importance: 3
  confidence: medium
  categories: [civilisation]
  summary: A bronze-working, chariot-building complex across the western steppe,
    widely associated with the Indo-Iranian languages that later spread into
    Iran and the Indian subcontinent.
  related: [rigveda]

- id: scythians
  title: The Scythians
  kind: polity
  regions: [central-asia, eastern-europe]
  start: -900
  end: 300
  importance: 4
  confidence: medium
  categories: [kingdom, trade]
  summary: Mounted nomads ranging from the Black Sea to the Altai, known to
    Herodotus as unconquerable and to archaeology through frozen tombs that
    preserved their gold work, tattoos and horses.

- id: xiongnu
  title: Xiongnu confederation
  kind: polity
  regions: [central-asia, china]
  start: -209
  end: 91
  importance: 4
  confidence: medium
  categories: [empire]
  summary: The first great steppe confederation, powerful enough to extract
    tribute from Han China and to make wall-building a matter of state policy.
  related: [han-dynasty, silk-road]

- id: kushan-empire
  title: Kushan Empire
  kind: polity
  regions: [central-asia, north-india]
  start: [30, 30]
  end: [375, 375]
  importance: 4
  confidence: medium
  categories: [empire, trade, religion]
  summary: Founded by the Yuezhi from the steppe, it straddled the routes
    between Rome, Persia, India and China, and under Kanishka carried Buddhism
    north into Central Asia and on towards China.
  related: [silk-road, buddha]

- id: sogdian-merchants
  title: The Sogdian trading network
  kind: period
  regions: [central-asia]
  start: [200, 300]
  end: [900, 1000]
  importance: 4
  confidence: medium
  categories: [trade, writing]
  summary: Merchants from Samarkand and Bukhara ran the commerce of the Silk
    Road for centuries, and their language became its lingua franca — carrying
    Buddhist, Manichaean and Christian texts east alongside the goods.
  related: [silk-road]

- id: hephthalites
  title: The Hephthalites
  kind: polity
  regions: [central-asia, persia, north-india]
  start: [440, 450]
  end: [560, 570]
  importance: 3
  confidence: contested
  categories: [empire]
  note: Their origin and language remain unsettled; the sources are hostile and
    second-hand.
  summary: Steppe confederation that killed a Sasanian emperor, extracted
    tribute from Persia, and broke into north-west India, hastening the end of
    Gupta power.
  related: [gupta-empire]

- id: gokturk-khaganate
  title: Göktürk Khaganate
  kind: polity
  regions: [central-asia]
  start: 552
  end: 744
  importance: 4
  confidence: high
  categories: [empire, writing]
  summary: The first state to call itself Türk, stretching from Manchuria to
    the Black Sea, and the source of the Orkhon inscriptions — the earliest
    surviving texts in any Turkic language.

- id: uyghur-khaganate
  title: Uyghur Khaganate
  kind: polity
  regions: [central-asia]
  start: 744
  end: 840
  importance: 3
  confidence: high
  categories: [empire, religion]
  summary: Steppe empire that adopted Manichaeism as a state religion and
    propped up the Tang dynasty after the An Lushan rebellion, at a price.
  related: [tang-dynasty]

- id: samanid-empire
  title: Samanid Empire
  kind: polity
  regions: [central-asia, persia]
  start: 819
  end: 999
  importance: 4
  confidence: high
  categories: [empire, dynasty]
  summary: Presided over a Persian literary and scientific revival centred on
    Bukhara, whose library and patronage produced Avicenna and Ferdowsi's
    Shahnameh.
  related: [avicenna, al-biruni]

- id: karakhanid-khanate
  title: Kara-Khanid Khanate
  kind: polity
  regions: [central-asia]
  start: 840
  end: 1212
  importance: 3
  confidence: medium
  categories: [empire, religion]
  summary: The first Turkic dynasty to adopt Islam, which set the religious
    course of Central Asia for the next thousand years.

- id: seljuk-empire
  title: Seljuk Empire
  kind: polity
  regions: [central-asia, persia, anatolia]
  start: 1037
  end: 1194
  importance: 4
  confidence: high
  categories: [empire]
  summary: Turkic dynasty out of the steppe that took Baghdad, shattered
    Byzantine power at Manzikert in 1071, and so opened Anatolia to Turkish
    settlement and Europe to the idea of a crusade.
  related: [ottoman-empire]

- id: khwarazmian-empire
  title: Khwarazmian Empire
  kind: polity
  regions: [central-asia, persia]
  start: 1077
  end: 1231
  importance: 3
  confidence: high
  categories: [empire]
  summary: The dominant power of Central Asia until its shah executed Genghis
    Khan's envoys, an error that brought the Mongols down on it and erased the
    state within five years.
  related: [genghis-khan, mongol-empire]

- id: genghis-khan
  significance: >-
    He unified the steppe in twenty years and left an administrative system
    that outlived him by a century. The Black Death travelled the routes his
    conquests opened.
  title: Genghis Khan
  kind: person
  regions: [central-asia]
  start: [1155, 1167]
  end: 1227
  importance: 5
  confidence: contested
  categories: [ruler]
  note: The birth year is given variously as 1155, 1162 or 1167 across the
    surviving sources.
  summary: Unified the Mongol tribes and built, in twenty years, the machinery
    that would conquer more territory than any leader before or since.
  related: [mongol-empire]

- id: mongol-empire
  significance: >-
    It killed on a scale that is still argued about, and it moved goods,
    ideas, technologies and plague across Eurasia faster than anything before.
    Both are true at once.
  title: Mongol Empire
  kind: polity
  regions: [central-asia, china, west-asia, eastern-europe]
  start: 1206
  end: 1368
  importance: 5
  confidence: high
  categories: [empire]
  note: Mortality estimates for the conquests run to tens of millions and are
    built largely from chroniclers with reason to exaggerate.
  summary: The largest contiguous land empire in history, stretching from Korea
    to Hungary. Its conquests were catastrophically violent, and the peace that
    followed moved goods, technologies, people and plague across Eurasia faster
    than at any time before.
  related: [genghis-khan, silk-road, black-death, golden-horde, chagatai-khanate]
  sources:
    - {title: "Encyclopaedia Britannica — Mongol empire", url: "https://www.britannica.com/place/Mongol-empire"}

