  related: [soviet-dissolution, aral-sea]

- id: aral-sea
  title: Desiccation of the Aral Sea
  kind: event
  regions: [central-asia]
  start: 1960
  end: ongoing
  importance: 4
  confidence: high
  categories: [climate]
  summary: Soviet irrigation diverted the two rivers feeding what was the
    world's fourth-largest lake; it has lost most of its volume, leaving a salt
    desert, a collapsed fishery and a public health crisis.
  related: [soviet-central-asia]

