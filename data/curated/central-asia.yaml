  related: [timur, mughal-empire, ulugh-beg]

- id: ulugh-beg
  title: Ulugh Beg and the Samarkand observatory
  kind: person
  regions: [central-asia]
  start: 1394
  end: 1449
  importance: 4
  confidence: high
  categories: [ruler, astronomy, scientist]
  summary: A Timurid ruler who built a three-storey sextant at Samarkand and
