  related: [opium-wars, taiping-rebellion, xinhai-revolution]

# ---- Chinese inventions ----
- id: paper-making
  title: Paper
  kind: technology
  regions: [china, east-asia]
  start: [-200, 105]
  end: 1400
  significance: >-
    Cheap writing material is the precondition for almost everything printed,
    which is why the printing press arrives in Europe only once paper has.
  importance: 5
  confidence: medium
  categories: [writing, discovery]
  note: Cai Lun is traditionally credited in 105 CE, but fragments predate him
    by up to three centuries; he probably improved and standardised a process
    already in use.
  summary: Cheap writing material, which took roughly a thousand years to reach
    Europe by way of Samarkand and the Islamic world.
  related: [sogdian-merchants, printing-press]

- id: woodblock-printing
  title: Woodblock printing
  kind: technology
  regions: [china, east-asia]
  start: [650, 700]
  end: 1450
  significance: >-
    It produced the world's earliest dated printed book in 868, six centuries
    before Gutenberg, and stayed better suited than movable type to a script
    of tens of thousands of characters.
  note: >-
    The bar ends where movable type takes over in Europe; block printing
    remained in use across East Asia long after.
  importance: 4
  confidence: medium
  categories: [writing, discovery]
  summary: Printing from carved blocks produced the world's earliest dated
    printed book in 868, some six centuries before Gutenberg.
  related: [printing-press, paper-making]

- id: movable-type
  title: Movable type
  kind: technology
  regions: [china, east-asia]
  start: [1040, 1045]
  end: 1450
  significance: >-
    The technology mattered less than the writing system it met. An alphabet
    of twenty-six letters suited it in a way forty thousand characters did
    not.
  note: >-
    From Bi Sheng's clay type to Gutenberg's metal type in Europe - the two
    ends of the same idea, four centuries apart.
  importance: 4
  confidence: medium
  categories: [writing, discovery]
  summary: Bi Sheng cut individual characters in clay four centuries before
    Gutenberg. With tens of thousands of characters to handle, it never
    displaced woodblock printing in China the way it did in Europe.
  related: [printing-press, woodblock-printing, song-dynasty]

- id: gunpowder
  significance: >-
    It ended the thousand-year military advantage of steppe cavalry, which
    closes the Central Asia lane as a source of world-conquering empires.
  title: Gunpowder
  kind: technology
  regions: [china, east-asia]
  start: [850, 900]
  end: 1500
  note: >-
    From the first formulae to firearms reshaping warfare on three continents.
  importance: 5
  confidence: medium
  categories: [discovery, war]
  summary: Found by alchemists looking for an elixir of immortality, and in use
    in weapons within two centuries. It ended the long military advantage of
    the steppe cavalry and, with it, an age.
  related: [song-dynasty, mongol-empire]

- id: magnetic-compass
  title: The magnetic compass
  kind: technology
  regions: [china, east-asia]
  start: [1040, 1119]
  end: 1500
  significance: >-
    Open-ocean sailing out of sight of land becomes routine rather than
    exceptional, which is the precondition for every voyage of the following
    two centuries.
  note: >-
    From the first navigational descriptions to routine use on ocean voyages.
  importance: 5
  confidence: medium
  categories: [discovery, exploration]
  summary: Known as a divination tool earlier, described for navigation by the
    eleventh century — the instrument that made open-ocean sailing routine.
  related: [song-dynasty, european-contact-pacific]

