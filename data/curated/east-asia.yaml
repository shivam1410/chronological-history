  related: [han-dynasty]

- id: sui-dynasty
  title: Sui Dynasty
  kind: polity
  regions: [china, east-asia]
  start: 581
  end: 618
  importance: 3
  confidence: high
  categories: [dynasty]
  summary: Reunified China after three centuries of division and built the
    Grand Canal, exhausting itself in the process and lasting barely a
    generation.
  related: [grand-canal, tang-dynasty]

- id: grand-canal
  title: The Grand Canal
  kind: structure
  regions: [china, east-asia]
  start: 605
  end: [609, 1293]
  importance: 4
  confidence: high
  categories: [architecture, trade]
  note: >-
    Two campaigns, not one: the Sui cut the main line between 605 and 609, and
    the Yuan rerouted it to reach Beijing by 1293. It ran to the present here
    until this was written, which is not how the rest of this dataset treats
    standing structures - the Great Pyramid gets forty years and the Panama
    Canal gets ten, both of them still in use. The building is the event; that
    it still carries freight belongs in a sentence, not in a bar.
  summary: Nearly 1,800 km linking the Yangtze rice country to the northern
    capitals, the longest artificial waterway ever built — and still working,
    seventeen centuries after the first stretch was dug.

- id: an-lushan-rebellion
  title: An Lushan Rebellion
  kind: event
  regions: [china, east-asia]
  start: 755
  end: 763
  importance: 4
  confidence: contested
  categories: [war]
  note: Census figures show a fall of some 36 million, but much of that is
    collapse of the registration system rather than deaths. The rebellion was
    nonetheless catastrophic.
  summary: A revolt that broke the Tang at its height, and by the census
    numbers is sometimes counted among the deadliest conflicts in history.
  related: [tang-dynasty, uyghur-khaganate]

- id: song-dynasty
  significance: >-
    Paper money, movable type, the compass and gunpowder weapons all in one
    dynasty. Europe would acquire these over the following four centuries and
    call the result a revolution.
  title: Song Dynasty
  kind: polity
  regions: [china, east-asia]
  start: 960
  end: 1279
  importance: 5
  confidence: high
  categories: [dynasty, trade]
  summary: A commercial and technological high point — paper money, movable
    type, the mariner's compass, gunpowder weapons and blast furnaces — all
    under a state run by examination-selected scholars rather than warriors.
  related: [gunpowder, movable-type, magnetic-compass, paper-making]

- id: yuan-dynasty
  title: Yuan Dynasty
  kind: polity
  regions: [china, east-asia]
  start: 1271
  end: 1368
  importance: 4
  confidence: high
  categories: [dynasty, empire]
  summary: Mongol rule over all of China, which opened the overland routes wide
    enough for Marco Polo to travel them and for plague to travel back.
  related: [mongol-empire, black-death]

- id: zheng-he-voyages
  title: The voyages of Zheng He
  kind: event
  regions: [china, east-asia]
  start: 1405
  end: 1433
  importance: 4
  confidence: high
  categories: [exploration, trade]
  summary: Seven Ming treasure fleets reached India, Arabia and East Africa
    with ships far larger than anything in Europe — and were then halted by
