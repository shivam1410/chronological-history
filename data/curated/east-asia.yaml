  related: [ming-dynasty, swahili-coast]

- id: qing-dynasty
  title: Qing Dynasty
  kind: polity
  regions: [china, east-asia]
  start: 1636
  end: 1912
  importance: 5
  confidence: high
  categories: [dynasty, empire]
  summary: China's last dynasty, Manchu in origin, which tripled the empire's
    territory and then spent its final century losing wars, territory and
