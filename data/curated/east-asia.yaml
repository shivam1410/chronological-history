  kind: period
  regions: [china, east-asia]
  start: 1966
  end: 1976
  importance: 5
  confidence: high
  categories: [human-rights]
  summary: A decade of mobilised political violence that closed universities,
    destroyed historical artefacts and monasteries, and displaced or killed
