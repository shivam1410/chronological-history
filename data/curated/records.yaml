- id: jesus
  title: Jesus of Nazareth
  kind: person
  regions: [levant, west-asia]
  start: [-6, -4]
  end: [30, 33]
  importance: 5
  confidence: contested
  categories: [religion]
  note: Birth is placed a few years before 1 CE because the calendar's
