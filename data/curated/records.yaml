  kind: work
  regions: [persia, west-asia]
  start: [846, 846]
  end: [915, 915]
  importance: 4
  confidence: medium
  categories: [scripture]
  summary: The reports of Muhammad's sayings and conduct were sifted and
    compiled roughly two centuries after his death, by compilers who developed
