- id: zoroaster
  title: Zoroaster
  kind: person
  regions: [persia, west-asia]
  start: [-1500, -628]
  end: [-1000, -551]
  importance: 4
  confidence: contested
  categories: [religion, philosopher]
  note: One of the widest genuine disputes in chronology. Linguistic analysis
    of the Gathas suggests roughly 1500–1000 BCE; Greek and later Zoroastrian
    sources suggest the seventh or sixth century BCE. The bracket spans both.
  summary: Prophet of Zoroastrianism, who framed existence as a moral contest
    between truth and falsehood — a dualism that shaped later Jewish, Christian
    and Islamic thought.
  related: [avesta-written]
  texts:
    - {title: "Zoroastrian texts at the Internet Sacred Text Archive", url: "https://archive.sacred-texts.com/zor/index.htm"}

- id: homer
  title: Homer
  kind: person
  regions: [greece, europe]
  start: [-850, -750]
  end: [-800, -700]
  importance: 3
  confidence: contested
  note: Whether Homer was one poet, several, or a name attached to a tradition
    is unresolved and probably unresolvable.
  categories: [poet, literature]
  summary: The name attached to the Iliad and the Odyssey, composed orally and
