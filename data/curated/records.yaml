- id: bijak-kabir
  title: The Kabir collections are written down
  kind: work
  regions: [north-india, india]
  start: [1570, 1604]
  end: [1700, 1805]
  importance: 3
  confidence: contested
  categories: [scripture, poet]
  note: Three separate traditions preserve different Kabirs — the Bijak of the
    Kabir Panth, the Guru Granth Sahib selection, and the Rajasthani
    manuscripts. They disagree on wording and on which verses are his at all.
  summary: Kabir was probably illiterate and certainly did not write a book;
    what survives was collected by followers from oral circulation, decades to
    centuries after his death.
  related: [kabir, adi-granth-compiled]

- id: avesta-written
  title: The Avesta is written down
  kind: work
  regions: [persia, west-asia]
  start: [224, 300]
  end: [600, 651]
  importance: 4
  confidence: contested
  categories: [scripture]
  note: A script was invented specifically to record it. Much of the canon was
    subsequently lost; what survives is a fraction of what Sasanian sources
    describe.
  summary: Possibly two thousand years after Zoroaster, the Sasanian empire
    committed the Avesta to writing — the widest gap between a founder and a
    written record in this dataset.
  related: [zoroaster]
  texts:
    - {title: "Zoroastrian texts at the Internet Sacred Text Archive", url: "https://archive.sacred-texts.com/zor/index.htm"}

- id: plato-on-socrates
  title: Plato and Xenophon write down Socrates
  kind: work
  regions: [greece, europe]
  start: [-399, -395]
  end: [-355, -347]
  importance: 4
  confidence: medium
  note: Whether the dialogues report Socrates or use him as a mouthpiece for
    Plato is the "Socratic problem", and is unresolved.
  categories: [philosopher, literature]
  summary: Socrates wrote nothing. Everything attributed to him comes from
    students writing within a generation of his execution — the shortest gap
    here, and still enough for two portraits that do not fully agree.
  related: [socrates, plato]
  texts:
    - {title: "Classical texts at the Internet Sacred Text Archive", url: "https://archive.sacred-texts.com/cla/index.htm"}

