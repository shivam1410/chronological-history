- id: guru-granth-sahib
  title: The Guru Granth Sahib becomes the final Guru
  kind: work
  regions: [north-india, india]
  start: 1705
  end: 1708
  importance: 5
  confidence: high
  categories: [scripture]
  note: Sikh tradition regards the text as a living Guru rather than a record
    of one, which makes "record gap" an imperfect description here.
  summary: Guru Gobind Singh added the ninth Guru's hymns and declared the
