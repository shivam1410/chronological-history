- id: quran-codified
  title: The Uthmanic codification of the Quran
  kind: work
  regions: [arabia, west-asia]
  start: [650, 650]
  end: [656, 656]
  importance: 5
  confidence: medium
  categories: [scripture]
  note: Islamic doctrine holds the Quran to be the uncreated word of God,
    recited by Muhammad and memorised and written by companions during his
    lifetime; the caliph Uthman's work was standardisation of an existing text,
    not composition. Manuscript finds at Sana'a are broadly consistent with an
    early fixed text.
  summary: Roughly two decades after Muhammad's death, a standard written
    version was established and variant copies withdrawn — the shortest gap
    between a founder and a fixed text of any major tradition.
  related: [muhammad]
  texts:
    - {title: "Islamic texts at the Internet Sacred Text Archive", url: "https://archive.sacred-texts.com/isl/index.htm"}

