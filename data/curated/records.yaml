# The record gap: each major figure paired with the date the surviving account
# of them was written down. The distance is often centuries, and seeing the two
# bars side by side says something prose struggles to.
#
# Where a tradition holds its text to be contemporaneous, eternal, or preserved
# exactly by oral transmission, the note says so. These are the academic
# datings of the surviving written record, not a verdict on the tradition.

# ---- figures not yet in the dataset ----
- id: mahavira
  title: Mahavira
  kind: person
  regions: [north-india, india]
  start: [-599, -497]
  end: [-527, -425]
  importance: 4
  confidence: contested
  categories: [religion, philosopher]
  note: Jain tradition gives 599–527 BCE. Much modern scholarship places him
    later, roughly 497–425 BCE, partly by tying his dates to the revised
    chronology of the Buddha.
  summary: The twenty-fourth and last Tirthankara of Jainism, who taught
    radical non-violence, non-attachment and the many-sidedness of truth.
  related: [jain-agamas, buddha]
