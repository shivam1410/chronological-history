  related: [homeric-epics-written]

# ---- the records ----
- id: pali-canon-written
  title: The Pali Canon is committed to writing
  kind: work
  regions: [sri-lanka, india]
  start: [-29, -29]
  end: [-17, 100]
  importance: 5
  confidence: contested
  categories: [scripture]
  note: Sri Lankan chronicles place the writing at Aluvihare during a famine,
    around 29 BCE. Theravada tradition holds the oral transmission to have been
    exact, so the gap is a gap in writing, not necessarily in content.
  summary: Roughly four centuries after the Buddha's death, his teachings were
    written on palm leaves in Sri Lanka because war and famine threatened the
    monks who held them in memory.
  related: [buddha]
  texts:
    - {title: "Buddhist texts at the Internet Sacred Text Archive", url: "https://archive.sacred-texts.com/bud/index.htm"}
  sources:
    - {title: "Encyclopaedia Britannica — Pali canon", url: "https://www.britannica.com/topic/Tipitaka"}

- id: jain-agamas
  title: The Jain Agamas are fixed in writing
  kind: work
  regions: [west-india, india]
  start: [453, 466]
  end: [453, 466]
  importance: 4
  confidence: contested
  categories: [scripture]
  note: The council at Valabhi is dated to either 453 or 466 CE. The Digambara
    tradition holds that the original canon was lost entirely, and does not
    accept the Svetambara Agamas — so the gap is disputed in kind, not only in
    length.
  summary: Close to a millennium after Mahavira, a council in Gujarat set down
    the Svetambara canon that had until then been carried orally.
  related: [mahavira]
  texts:
    - {title: "Jainism texts at the Internet Sacred Text Archive", url: "https://archive.sacred-texts.com/jai/index.htm"}

- id: gospels
  title: Composition of the canonical Gospels
  kind: work
  regions: [levant, west-asia]
  start: [65, 70]
  end: [95, 110]
  importance: 5
  confidence: contested
  categories: [scripture]
  note: Mark is generally dated around 65–75 CE, Matthew and Luke in the 80s,
    John around 90–110. Traditional attributions to eyewitnesses are held by
    many Christians and doubted by most critical scholars.
  summary: The four accounts of Jesus's life were written between roughly
