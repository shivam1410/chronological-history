  kind: person
  regions: [science, britain]
  start: 1643
  end: 1727
  importance: 5
  confidence: high
  categories: [scientist, physics, mathematics]
  note: Born 25 December 1642 by the Julian calendar England still used;
    4 January 1643 in the Gregorian calendar used here.
  summary: Showed that the same law of gravitation governs a falling apple and
    an orbiting moon, and built the calculus needed to prove it.
  related: [kepler, galileo]

