  related: [lovelace, turing]

- id: lovelace
  title: Ada Lovelace
  kind: person
  regions: [science, britain]
  start: 1815
  end: 1852
  importance: 4
  confidence: high
  categories: [scientist, computing, mathematics]
  note: Whether her notes constitute the first computer program is argued.
    What is not argued is that she saw the machine could operate on symbols
    rather than only numbers, which Babbage's own writing does not say.
  summary: Whose notes on the Analytical Engine include an algorithm for
    computing Bernoulli numbers, and the observation that such a machine might
    compose music — the first published sense of a computer as more than a
    calculator.
  related: [babbage]

- id: boole
