# Alan Turing sits above with the mathematicians, where he belongs; these are
# the people and machines on either side of him. The lane had a theory of
# computation and nothing that computed.

- id: babbage
  title: Charles Babbage
  kind: person
  regions: [science, britain]
  start: 1791
  end: 1871
  importance: 4
  confidence: high
  categories: [scientist, computing, mathematics]
  summary: Designed the Difference Engine and then the Analytical Engine, a
    general-purpose mechanical computer with a store, a mill and punched-card
