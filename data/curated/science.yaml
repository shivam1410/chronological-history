# ---- discoveries, as distinct from the people who made them ----
- id: zero-decimal-system
  significance: >-
    Treating nothing as a number is the single most consequential notational
    change in mathematics. Every calculation you have ever done depends on it.
  title: Zero and the decimal place-value system
  kind: technology
  regions: [science, north-india]
  start: [-300, 300]
  end: [628, 628]
  importance: 5
  confidence: contested
  categories: [mathematics, discovery]
  note: Place value appears in Indian texts over several centuries; Brahmagupta
    in 628 CE gives the first surviving rules for zero as a number.
  summary: Treating zero as a number rather than an absence made written
    arithmetic practical and underlies every calculation since.
  related: [brahmagupta, al-khwarizmi]

- id: telescope
  title: The telescope
  kind: technology
  regions: [science, western-europe]
  start: 1608
  end: 1700
  significance: >-
    Pointed at the sky in 1609, it ended the idea of a perfect and unchanging
    heaven within a single lifetime.
  note: >-
    From the Dutch lens-grinders to the instrument being standard equipment in
    astronomy.
  importance: 4
  confidence: high
  categories: [instrument, astronomy, discovery]
  summary: A Dutch lens-grinder's device that, pointed upward the following
    year, ended the idea of a perfect and unchanging heaven.
  related: [galileo]

- id: vaccination
  title: Vaccination
  kind: technology
  regions: [science, britain]
  start: 1796
  end: 1900
  significance: >-
    It is the only medical technique that has driven a human disease to
    extinction, which it did to smallpox in 1980.
  note: >-
    From Jenner's demonstration to national vaccination programmes across
    Europe and the Americas.
  importance: 5
  confidence: high
  categories: [medicine, discovery]
  summary: Jenner's demonstration that cowpox protects against smallpox,
    building on much older inoculation practice in Asia and Africa.

- id: germ-theory
  title: Germ theory of disease
  kind: technology
  regions: [science, western-europe]
  start: [1860, 1880]
  end: 1900
  significance: >-
    Accepting that specific organisms cause specific diseases is what made
    surgery survivable and public sanitation rational rather than merely tidy.
  note: >-
    From Pasteur and Koch's work to general acceptance and the sanitation and
    antisepsis that followed from it.
  importance: 5
  confidence: medium
  categories: [medicine, biology, discovery]
  summary: Pasteur and Koch established that specific microorganisms cause
    specific diseases, which made antisepsis and public sanitation rational.

- id: dna-structure
  significance: >-
    The structure explained the function immediately - a molecule shaped to be
