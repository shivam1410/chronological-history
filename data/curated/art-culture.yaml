# Art & Culture: the makers, and the traditions they worked in.
#
# The lane exists so that a reader looking at one century can see who was
# making anything anywhere - Kalidasa and the late Roman poets, Li Bai and the
# Abbasid court, Hokusai and Beethoven within thirty years of each other.
#
# Dates for pre-modern figures are often a bracket around a working life
# rather than a birth and a death, and where that is so the note says which.
# For a tradition rather than a person - Ajanta, ukiyo-e, jazz - the bracket
# is the period of the work, which is what the entry is about.
#
# Two things stay out of this lane on purpose. Monuments belong to the
# civilisation that raised them, so Angkor Wat, the Taj Mahal, Borobudur, the
# Great Pyramid and the moai stay in their regional lanes. And figures who are
# saints first and poets second - Kabir, Mirabai, Tulsidas, Guru Nanak - stay
# in the Indian Subcontinent lane, where their verse sits beside the
# devotional movement that produced it.

