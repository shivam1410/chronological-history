  end: [450, 470]
  importance: 4
  confidence: contested
  categories: [poet, literature]
  note: One of the wider genuine disputes in Indian literary chronology.
    Nothing in the works names a patron unambiguously, so the dating rests on
    language, on astronomical references, and on the tradition placing him at
    a Gupta court. Proposals run from the first century BCE to the sixth
    century CE; the bracket holds the Gupta dating most scholars accept.
  summary: The pre-eminent poet and dramatist of classical Sanskrit, whose
    Shakuntala and Meghaduta set the standard against which later Sanskrit
