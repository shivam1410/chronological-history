# ---- visual art ------------------------------------------------------------
# The dataset had monuments but no makers: no painter, sculptor or composer
# anywhere in it. Monuments stay with their civilisations; these are the
# people and traditions that made images and sound.

- id: phidias-greek-sculpture
  title: Greek sculpture reaches naturalism
  kind: period
  regions: [art-culture, greece]
  start: [-480, -470]
  end: [-400, -400]
  importance: 3
  confidence: medium
  categories: [art, sculpture]
  note: Almost nothing survives in the original. The Parthenon figures are
    Phidias's by attribution and workshop, and most famous Greek statues are
    known only through Roman marble copies of lost bronzes.
  summary: In two generations Greek sculptors went from rigid frontal figures
    to bodies with weight shifted onto one leg — a way of carving the human
    body that European art returned to twice, at the Renaissance and again in
    the eighteenth century.

