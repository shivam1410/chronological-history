- id: printing-press
  significance: >-
    Bi Sheng had movable type four centuries earlier, but an alphabet of 26
    letters suited it in a way 40,000 characters did not. The technology
    mattered less than the writing system it met.
  title: Gutenberg's printing press
  kind: technology
  regions: [science, western-europe]
  start: [1440, 1450]
  end: 1500
  note: >-
    The incunabula period, by the end of which presses were operating in more
    than two hundred European towns.
  importance: 5
  confidence: medium
  categories: [writing]
  summary: Movable metal type in Mainz made books reproducible at scale,
    accelerating the Reformation, the scientific revolution and mass literacy.

- id: inca-empire
