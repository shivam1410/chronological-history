- id: roman-empire
  significance: >-
    Its collapse in the west is the reference point Europe measured itself
    against for a thousand years, and the reason 'the fall of Rome' still
    functions as shorthand for civilisational loss.
  title: Roman Empire (West)
  kind: polity
  regions: [rome, europe, north-africa, west-asia]
  start: -27
  end: 476
  importance: 5
  confidence: high
  categories: [empire]
  summary: From Augustus to the deposition of Romulus Augustulus, an empire
    encircling the Mediterranean whose law, language and roads outlasted it.

