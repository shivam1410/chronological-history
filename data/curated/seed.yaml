# Phase 1 seed. Deliberately spans every lane and every time scale so the
# renderer is exercised end to end. Dates that scholarship disputes carry a
# wide bracket, confidence: contested, and a note naming the competing views.

# ---------------------------------------------------------------- deep time
- id: earth-formation
  significance: >-
    Everything else on this timeline is compressed into the last tenth of it.
    If the Earth's history were a single day, recorded human history would
    occupy the final second.
  title: Formation of the Earth
  kind: geological
  regions: [earth-life]
  start: "4.54 Ga"
  end: "4.54 Ga"
  importance: 5
  confidence: medium
  categories: [evolution]
  summary: Accretion of the Earth from the solar nebula, dated by radiometric
    analysis of meteorites and the oldest terrestrial minerals.
  sources:
    - {title: "USGS — Age of the Earth", url: "https://pubs.usgs.gov/gip/geotime/age.html"}

- id: cambrian-explosion
  title: Cambrian Explosion
  kind: biological
  regions: [earth-life]
  start: "538.8 Ma"
  end: "515 Ma"
  importance: 4
  confidence: medium
  categories: [evolution]
  summary: A geologically rapid diversification in which most major animal body
    plans first appear in the fossil record.

- id: permian-triassic-extinction
  title: Permian–Triassic Extinction
  kind: event
  regions: [earth-life]
  start: "251.9 Ma"
  end: "251.9 Ma"
  importance: 4
  confidence: medium
  categories: [extinction]
  summary: The most severe extinction event known, eliminating roughly 80% of
    marine species and clearing the ground for the rise of the dinosaurs.

- id: dinosaur-era
  significance: >-
    Their 165-million-year run dwarfs our own. Anatomically modern humans have
    existed for roughly 0.2% as long, which is the proportion this timeline is
    built to make visible.
  title: Age of the Dinosaurs
  kind: biological
  regions: [earth-life]
  start: ["243 Ma", "233 Ma"]
  end: "66 Ma"
  importance: 5
  confidence: medium
  categories: [evolution]
  note: The earliest undisputed dinosaur fossils date to about 233 Ma; possible
    earlier forms push the origin back towards 243 Ma.
  summary: Non-avian dinosaurs dominated terrestrial ecosystems for some 165
    million years, from the Late Triassic until the end of the Cretaceous.
  related: [permian-triassic-extinction, kpg-extinction]
  sources:
    - {title: "Natural History Museum — Dinosaurs", url: "https://www.nhm.ac.uk/discover/dino-directory.html"}

- id: kpg-extinction
  significance: >-
    One bad afternoon reset the terms of life on land. Mammals had already
    existed for 160 million years as small nocturnal animals; the impact is
    what let them become anything else.
  title: Cretaceous–Paleogene Extinction
  kind: event
  regions: [earth-life]
  start: "66 Ma"
  end: "66 Ma"
  importance: 5
  confidence: high
  categories: [extinction]
  summary: An asteroid impact at Chicxulub ended the non-avian dinosaurs and
    about three quarters of all species, opening the way for mammals.
  related: [dinosaur-era]

- id: himalayan-orogeny
  significance: >-
    Still happening. The collision that raised these mountains also drives the
    monsoon that waters the subcontinent, which means it underwrites nearly
    every Indian entry that follows.
  title: Himalayan Orogeny — India collides with Eurasia
  kind: geological
  # Earth & Life rather than the India lane. The dates are right - the range
  # is still rising - but 59 Myr was the only entry in the Himalaya
  # sub-region, so expanding India conjured a whole row to hold one bar that
  # spanned the window and said the same thing at every zoom. Geology belongs
  # in the geology lane, where a 59-million-year bar is unremarkable. India
  # and Himalaya stay as chips, so the connection the entry argues for is
  # still on the card.
  regions: [earth-life, himalaya, india]
  start: ["59 Ma", "50 Ma"]
  end: ongoing
  importance: 5
  confidence: medium
  categories: [orogeny]
  note: Estimates for the onset of continental collision range from about 59 Ma
    to 50 Ma depending on whether initial contact or full suturing is dated.
  summary: The Indian plate, having drifted north from Gondwana, collided with
    Eurasia and drove up the Himalaya and the Tibetan Plateau. The range is
    still rising by roughly 5 mm a year.
  sources:
    - {title: "USGS — The Himalayas: Two continents collide", url: "https://pubs.usgs.gov/gip/dynamic/himalaya.html"}

- id: pleistocene
  title: Pleistocene Epoch
  kind: period
  regions: [earth-life]
  start: "2.58 Ma"
  end: "11.7 ka"
  importance: 4
  confidence: high
  categories: [climate, glaciation]
  summary: The epoch of repeated glacial cycles, during which ice sheets
    advanced and retreated more than twenty times and the genus Homo spread
    across the globe.

- id: last-glacial-period
  significance: >-
    Sea level was about 125 metres lower, which is why people could walk into
    Australia and the Americas. Almost every coastline on this timeline before
    10,000 years ago is now underwater.
  title: Last Glacial Period
  kind: period
  regions: [earth-life]
  start: "115 ka"
  end: "11.7 ka"
  importance: 5
  confidence: high
  categories: [glaciation, climate]
  summary: The most recent ice age, when ice sheets covered much of North
    America and northern Eurasia and sea level fell by about 125 metres.
  related: [last-glacial-maximum, holocene]

- id: last-glacial-maximum
  title: Last Glacial Maximum
  # 7,500 years of ice at its greatest extent: a period, not a moment.
  kind: period
  regions: [earth-life]
  start: "26.5 ka"
  end: "19 ka"
  importance: 4
  confidence: high
  categories: [glaciation, climate]
  summary: The peak of the last ice age, when continental ice sheets reached
    their greatest extent and Beringia linked Asia to the Americas.

- id: toba-eruption
  title: Toba Supereruption
  kind: event
  regions: [southeast-asia, earth-life]
  start: "74 ka"
  end: "74 ka"
  importance: 3
  confidence: medium
  categories: [climate]
  summary: A supervolcanic eruption in Sumatra, the largest of the Quaternary,
    followed by a volcanic winter of disputed severity.

- id: holocene
  title: Holocene Epoch
  kind: period
  regions: [earth-life]
  start: "11.7 ka"
  end: ongoing
  importance: 5
  confidence: high
  categories: [climate]
  summary: The current interglacial epoch. Every agricultural society, city and
    written record belongs to it.

- id: homo-sapiens
  significance: >-
    Our species is younger than the Sahara and roughly the same age as the
    oldest surviving cave floors. Everything in the lanes below happened in
    the last 5% of our existence.
  title: Homo sapiens
  kind: biological
  # Earth & Life, with Africa kept as a chip. Sixteen of the seventeen
  # hominin entries already live there - Lucy, Paranthropus, erectus,
  # the Neanderthals, out-of-africa - and our own species was the lone
  # exception sitting in a regional lane. It also left the Africa lane
  # opening on a 313,000-year bar and then nothing until 2686 BCE.
  regions: [earth-life, east-africa, africa]
  start: ["315 ka", "200 ka"]
  end: ongoing
  importance: 5
  confidence: medium
  categories: [evolution]
  note: The Jebel Irhoud fossils push anatomically modern traits back to about
    315 ka; fully modern morphology is usually placed nearer 200 ka.
  summary: Anatomically modern humans appear in Africa and subsequently disperse
    across every continent.

- id: aboriginal-australia
  title: Settlement of Australia
  kind: event
  regions: [oceania]
  start: ["65 ka", "50 ka"]
  end: ["50 ka", "45 ka"]
  importance: 4
  confidence: medium
  categories: [exploration]
  note: The bracket is the crossing and the spread across Sahul, not the
    occupation that followed. The continuity is in the summary, where it can be
    stated; as a bar running to the present it read as a 65,000-year arrival.
  summary: Humans crossed Wallacea to reach Sahul, beginning the longest
    continuous cultural tradition known, unbroken to the present day.

- id: neolithic-revolution
  title: Neolithic Revolution — agriculture begins
  kind: technology
  regions: [global]
  start: "12 ka"
  end: "5 ka"
  importance: 5
  confidence: medium
  categories: [civilisation]
  summary: Independent domestication of plants and animals in the Fertile
    Crescent, China, Mesoamerica, the Andes and elsewhere, ending the exclusively
    foraging way of life.

# ---------------------------------------------------------- ancient world
- id: cuneiform
  significance: >-
    Recorded history begins here, and it begins with accounting. The earliest
    writing is not poetry or scripture but a record of who owed what grain to
    whom.
  title: Invention of Writing — Cuneiform
  kind: technology
  regions: [mesopotamia, west-asia]
  start: [-3400, -3100]
  end: 75
  importance: 5
  confidence: medium
  categories: [writing]
  summary: Sumerian accountants in Uruk turned clay tokens into impressed signs,
    producing the earliest known writing system and the beginning of recorded
    history.

- id: bronze-age
  title: Bronze Age
  kind: period
  regions: [global]
  start: -3300
  end: -1200
  importance: 4
  confidence: medium
  categories: [civilisation]
  summary: The era of tin-bronze metallurgy, palace economies and the first
    long-distance trade networks across Eurasia.

- id: indus-valley
  significance: >-
    Larger in area than Egypt and Mesopotamia combined, with standardised
    weights and planned drainage - and a script nobody can read. It is the
    largest early civilisation we understand the least.
  title: Indus Valley Civilisation
  kind: polity
  regions: [west-india, north-india, india]
  start: -3300
  end: -1300
  importance: 5
  confidence: medium
  categories: [civilisation]
  summary: The largest Bronze Age civilisation by area, with planned cities at
    Mohenjo-daro and Harappa, standardised weights, and a script that remains
    undeciphered.
  sources:
    - {title: "UNESCO — Archaeological Ruins at Moenjodaro", url: "https://whc.unesco.org/en/list/138/"}

- id: egypt-old-kingdom
  title: Old Kingdom of Egypt
  kind: polity
  regions: [egypt, africa]
  start: -2686
  end: -2181
  importance: 4
  confidence: medium
  categories: [dynasty, civilisation]
  summary: The pyramid age, when a centralised Egyptian state organised labour
    on a scale not seen before.

- id: great-pyramid
  title: Great Pyramid of Giza
  kind: structure
  regions: [egypt, africa]
  start: [-2580, -2560]
  end: [-2560, -2540]
  importance: 4
  confidence: medium
  categories: [architecture]
  summary: Tomb of Khufu and the only surviving wonder of the ancient world;
    the tallest human-made structure for nearly four thousand years.

- id: rigveda
  significance: >-
    Transmitted by memory with such precision that the oral version is
    considered more reliable than the manuscripts. It is the oldest text in
    this dataset still in continuous liturgical use.
  title: Composition of the Rigveda
  kind: work
  regions: [north-india, india]
  start: [-1700, -1100]
  end: [-1200, -900]
  importance: 5
  confidence: contested
  categories: [scripture]
  note: Most philologists place the core hymns c. 1500–1200 BCE on linguistic
    grounds; some Indian scholars argue for substantially earlier dates tied to
    the Sarasvati river and Indus continuity. No manuscript evidence survives
    from the period, so all dates are inferential.
  summary: The oldest surviving Sanskrit text and the foundational Vedic
    scripture, transmitted orally with extraordinary fidelity for millennia
    before being written down.
  aliases: [Rig Veda, Ṛgveda]
  sources:
    - {title: "Encyclopaedia Britannica — Rigveda", url: "https://www.britannica.com/topic/Rigveda"}
    - {title: "UNESCO Memory of the World — Rigveda", url: "https://www.unesco.org/en/memory-world/rigveda"}

- id: iron-age
  title: Iron Age
  kind: period
  regions: [global]
  start: -1200
  end: -550
  importance: 3
  confidence: medium
  categories: [civilisation]
  summary: Iron smelting spread across Eurasia and Africa, cheapening tools and
    weapons and reshaping the societies that adopted it.

- id: upanishads
  title: Composition of the principal Upanishads
  kind: work
  regions: [north-india, india]
  start: [-800, -500]
  end: [-300, 100]
  importance: 5
  confidence: contested
  categories: [scripture, philosophy]
  note: >-
    The oldest prose Upanishads, Brihadaranyaka and Chandogya, are usually put
    at c. 800-500 BCE and are pre-Buddhist. The verse Upanishads follow in the
    last centuries BCE, and Olivelle places the two late prose ones, Prashna and
    Mandukya, no earlier than about the start of the common era - which is where
    the bracket closes. He also warns that any dating of these texts more
    precise than a few centuries is a house of cards.
  summary: Philosophical dialogues concluding the Vedic corpus, introducing
    brahman, atman and rebirth, and forming the basis of Vedanta.
  related: [rigveda, bhagavad-gita, yoga-sutras]

- id: buddha
  significance: >-
    The dates matter more than they look. Shifting him a century changes what
    he was responding to, and it moves the Pali Canon's four-century gap along
    with him.
  title: Siddhartha Gautama, the Buddha
  kind: person
  regions: [north-india, india]
  start: [-563, -480]
  end: [-483, -400]
  importance: 5
  confidence: contested
  categories: [religion, philosophy]
  note: The traditional "long chronology" gives 563–483 BCE; most modern
    scholarship prefers a "short chronology" placing his death nearer 400 BCE.
  summary: Founder of Buddhism, who taught a middle path between asceticism and
    indulgence in the Gangetic plain of the Mahajanapada era.
  aliases: [Gautama Buddha, Shakyamuni, Siddhartha]
  sources:
    - {title: "Encyclopaedia Britannica — Buddha", url: "https://www.britannica.com/biography/Buddha-founder-of-Buddhism"}

- id: achaemenid-empire
  title: Achaemenid Empire
  kind: polity
  regions: [persia, west-asia]
  start: -550
  end: -330
  importance: 4
  confidence: high
  categories: [empire]
  summary: The first Persian empire, stretching from the Indus to the Aegean and
    administered through satrapies and the Royal Road.

- id: classical-athens
  title: Classical Athens
  kind: polity
  regions: [greece, europe]
  start: -508
  end: -322
  importance: 4
  confidence: high
  categories: [kingdom, philosophy]
  summary: The democratic city-state of Socrates, Plato, Aeschylus and the
    Parthenon, whose institutions and ideas shaped later European thought.

- id: ramayana
  significance: >-
    Its reach is the point. Versions belong to Thailand, Indonesia, Cambodia
    and Laos, which makes it one of the few narratives to have become
    foundational to cultures that never shared a state.
  title: Composition of the Valmiki Ramayana
  kind: work
  regions: [north-india, india]
  start: [-700, -400]
  end: [100, 300]
  importance: 5
  confidence: contested
  categories: [epic, scripture]
  note: >-
    Books 2 to 6 are the oldest, with 1 and 7 added later. Brockington reads the
    language and puts the first oral stage around the fifth century BCE;
    Goldman argues the archetype cannot be much earlier than the start of the
    seventh, which is where the bracket opens. The text reached something like
    its present form by about the third century CE. Traditional accounts place
    the events far earlier, in the Treta Yuga.
  summary: The Sanskrit epic of Rama, Sita and Ravana, ascribed to Valmiki. With
    the Mahabharata it is one of the two great epics of the subcontinent and the
    source of retellings across South and Southeast Asia.
  aliases: [Rāmāyaṇa]
  related: [mahabharata, tulsidas]
  sources:
    - {title: "Encyclopaedia Britannica — Ramayana", url: "https://www.britannica.com/topic/Ramayana-Indian-epic"}

- id: mahabharata
  significance: >-
    Roughly ten times the length of the Iliad and Odyssey combined, and it
    absorbs the Bhagavad Gita as a late insertion - a philosophy that entered
    the world embedded in a war story.
  title: Composition of the Mahabharata
  kind: work
  regions: [north-india, india]
  start: [-400, -300]
  end: [300, 400]
  importance: 5
  confidence: contested
  categories: [epic, scripture]
  note: Composed and expanded over roughly eight centuries; the Bhagavad Gita is
    a later insertion usually dated to the first centuries BCE or CE.
  summary: The longest epic poem known, recounting the Kurukshetra war between
    the Pandavas and Kauravas and absorbing an enormous body of philosophical
    and legal material.
  related: [ramayana, bhagavad-gita]

- id: maurya-empire
  significance: >-
    The first state to hold most of the subcontinent at once, and the
    benchmark every later Indian empire was measured against, including the
    Mughals two thousand years later.
  title: Maurya Empire
  kind: polity
  regions: [north-india, india, deccan]
  start: -322
  end: -184
  importance: 5
  confidence: high
  categories: [empire]
  summary: Founded by Chandragupta Maurya, the first empire to unify most of the
    subcontinent, governed from Pataliputra.
  related: [ashoka]

- id: ashoka
  significance: >-
    His edicts are the earliest deciphered Indian writing after the Indus
    script, and they are a ruler publicly regretting his own war - which is
    close to unique in the ancient record.
  title: Ashoka
  kind: person
  regions: [north-india, india]
  start: [-304, -304]
  end: -232
  importance: 5
  confidence: medium
  categories: [ruler]
  summary: Mauryan emperor who, after the carnage at Kalinga, embraced Buddhism
    and inscribed edicts of dhamma on rock and pillar across his empire.
  related: [maurya-empire, buddha]

- id: qin-dynasty
  title: Qin Dynasty
  kind: polity
  regions: [china, east-asia]
  start: -221
  end: -206
  importance: 4
  confidence: high
  categories: [dynasty, empire]
  summary: Shi Huangdi unified the warring states, standardised script, weights
    and axle widths, and began the Great Wall and the terracotta army.

- id: han-dynasty
  significance: >-
    Contemporary with Rome and comparable in scale, yet the two empires knew
    each other mostly as rumours at the ends of the Silk Road. The overlap on
    this timeline is the point.
  title: Han Dynasty
  kind: polity
  regions: [china, east-asia]
  start: -202
  end: 220
  importance: 5
  confidence: high
  categories: [dynasty, empire]
  summary: Four centuries of Chinese imperial rule that established the
    Confucian bureaucratic state and opened the Silk Road.
  related: [silk-road]

- id: silk-road
  title: Silk Road trade networks
  kind: period
  regions: [central-asia, china, west-asia, global]
  start: -130
  end: 1453
  importance: 4
  confidence: medium
  categories: [trade]
  summary: Overland routes linking China, India, Persia and the Mediterranean,
