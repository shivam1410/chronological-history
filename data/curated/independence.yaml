# Independence, grouped into the waves it actually came in. Individual dates
# for the largest or most consequential, period entries for the waves, so a
# single year like 1960 does not turn into seventeen indistinguishable marks.

- id: us-independence
  title: United States declares independence
  kind: event
  regions: [north-america, americas]
  start: 1776
  end: 1776
  importance: 5
  confidence: high
  categories: [independence]
  summary: Thirteen British colonies declared themselves free, on the argument
    that legitimate government rests on consent — an argument whose authors
    held people in slavery while making it.
  related: [locke, abolition-us]

- id: latin-american-independence
