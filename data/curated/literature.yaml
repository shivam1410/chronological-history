# Poets, and the works that outlived them.
#
# The lane exists so that a reader looking at one century can see who was
# writing anywhere - Kalidasa and the late Roman poets, Li Bai and the
# Abbasid court, Basho and Milton. Dates for pre-modern poets are often a
# bracket around a working life rather than a birth and a death, and where
# that is so the note says which.
#
# Figures who are saints first and poets second - Kabir, Mirabai, Tulsidas,
# Guru Nanak - stay in the Indian Subcontinent lane, where their verse sits
# beside the devotional movement that produced it.

# ---- classical ----
- id: sappho
  title: Sappho
  kind: person
  regions: [literature, greece]
  start: [-630, -612]
  end: [-570, -570]
  importance: 3
  confidence: contested
  categories: [poet, literature]
  note: Both dates are inferred from ancient testimony rather than recorded.
    Of nine books collected at Alexandria, one complete poem survives, with
    the rest in fragments and quotations.
  summary: A lyric poet of Lesbos who wrote about desire in the first person
    at a time when Greek poetry was mostly public and heroic, and whose metre
    still carries her name.

- id: valmiki
  title: Valmiki
  kind: person
  regions: [literature, north-india]
  start: [-500, -300]
  end: [-400, -200]
  importance: 4
  confidence: contested
  categories: [poet, epic, literature]
  note: Tradition calls him the adi-kavi, the first poet, and the bracket is
    the period of the Ramayana's composition rather than a recorded life. The
    text grew over centuries, so a single author is a simplification the
    tradition itself makes.
  summary: The poet to whom the Ramayana is ascribed, and with it the sloka
    metre that Sanskrit narrative verse used for the next two thousand years.
  related: [ramayana, kalidasa]

- id: virgil
  title: Virgil
  kind: person
  regions: [literature, rome]
  start: -70
  end: -19
  importance: 4
  confidence: high
  categories: [poet, epic, literature]
  summary: Author of the Aeneid, written to give Rome a founding epic to set
    beside Homer's, and left unfinished at his death with orders to burn it
    that Augustus overruled.
  related: [homer, roman-empire]

- id: ovid
  title: Ovid
  kind: person
  regions: [literature, rome]
  start: -43
  end: [17, 18]
  importance: 3
  confidence: high
  categories: [poet, literature]
  summary: Whose Metamorphoses carried Greek and Roman myth into European
    art wholesale, and who was exiled to the Black Sea by Augustus for a
    reason he never stated plainly.
  related: [virgil]

- id: kalidasa
  title: Kalidasa
  kind: person
  regions: [literature, north-india]
  start: [350, 400]
  end: [450, 470]
  importance: 4
  confidence: contested
  categories: [poet, literature]
  note: One of the wider genuine disputes in Indian literary chronology.
    Nothing in the works names a patron unambiguously, so the dating rests on
    language, on astronomical references, and on the tradition placing him at
    a Gupta court. Proposals run from the first century BCE to the sixth
    century CE; the bracket holds the Gupta dating most scholars accept.
  summary: The pre-eminent poet and dramatist of classical Sanskrit, whose
    Shakuntala and Meghaduta set the standard against which later Sanskrit
    verse was measured — and whose cloud-messenger conceit was still being
    imitated a thousand years on.
  related: [gupta-empire, valmiki, bhavabhuti]
  texts:
    - {title: "Sanskrit texts at the Internet Sacred Text Archive", url: "https://archive.sacred-texts.com/hin/index.htm"}

- id: bhavabhuti
  title: Bhavabhuti
  kind: person
  regions: [literature, north-india]
  start: [680, 700]
  end: [740, 760]
  importance: 2
  confidence: contested
  categories: [poet, literature]
  summary: The dramatist most often named in the same breath as Kalidasa,
    and the one who took Sanskrit drama towards grief and away from charm.
  related: [kalidasa]

- id: thiruvalluvar
  title: Thiruvalluvar
  kind: person
  regions: [literature, south-india]
  start: [-300, 100]
  end: [-200, 200]
  importance: 3
  confidence: contested
  categories: [poet, literature, ethics]
  note: The dating spans some five centuries and is argued on linguistic
    grounds. The Tamil Nadu government's official date of 31 BCE is a
    convention, not a finding.
  summary: Author of the Tirukkural, 1,330 couplets on virtue, wealth and
    love that belong to no one religion — which is why Jains, Hindus and
    Christians have each claimed him.

