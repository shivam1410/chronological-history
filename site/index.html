<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronological History</title>
<meta name="description" content="An interactive timeline from the formation of the Earth to the present day.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#8987;</text></svg>">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/timeline.css">
<link rel="stylesheet" href="css/panel.css">
</head>
<body>
<header class="header">
  <h1 class="header__title">Chronological&nbsp;History</h1>

  <div class="search">
    <input id="search" class="search__input" type="search" placeholder="Search history…"
           role="combobox" aria-expanded="false" aria-controls="results"
           aria-autocomplete="list" aria-label="Search entries" autocomplete="off" spellcheck="false">
    <kbd class="search__key">/</kbd>
    <ul id="results" class="results" role="listbox" aria-label="Search results" hidden></ul>
  </div>

  <form class="range" id="range" aria-label="Date range">
    <label class="visually-hidden" for="from">From year</label>
    <input id="from" class="range__input" spellcheck="false" placeholder="from">
    <span class="range__dash" aria-hidden="true">–</span>
    <label class="visually-hidden" for="to">To year</label>
    <input id="to" class="range__input" spellcheck="false" placeholder="to">
    <button type="submit" class="range__go">Go</button>
  </form>

  <nav class="eras" id="eras" aria-label="Jump to an era"></nav>
  <p class="header__meta" id="meta">Loading…</p>
</header>
<main class="stage" id="stage"></main>
<div class="minimap" id="minimap-wrap">
  <canvas class="minimap__canvas" id="minimap" aria-hidden="true"></canvas>
</div>
<div class="visually-hidden" role="status" aria-live="polite" id="live"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
